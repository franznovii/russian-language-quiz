<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#eeeae3">
<title>Предпросмотр экрана вопросов — вы́Читать</title>
<link rel="stylesheet" href="./style.css">
<style>
.mini-screen[hidden]{display:none!important}
.mini-screen{display:flex;flex-direction:column;position:relative;min-height:100dvh}
.quiz-head{display:flex;align-items:center;justify-content:space-between}
.question-options{display:grid}
.question-choice{display:flex;width:100%;gap:15px;align-items:center}
.timer-track>div{width:30%;height:100%}
.question-choice:disabled{opacity:1}
.test-label{font-size:11px}
.primary-btn{display:flex;align-items:center;justify-content:space-between}
#question-text{line-height:1.1}
.site-footer{display:flex}
</style>
<link rel="stylesheet" href="./assets/quiz-question-v1.css?v=1">
</head>
<body class="question-poster">
<div class="page">
 <header class="site-header"></header>
 <main>
  <section class="mini-screen" id="question-screen">
    <div class="quiz-head"><span id="question-count">Вопрос 2 из 6</span><span id="timer-chip" class="time-chip" role="timer" aria-label="Пример таймера">00:18</span></div>
    <div class="test-label" id="question-type">ОДИН ОТВЕТ</div>
    <div class="quiz-progress"><div id="progress" style="width:33%"></div></div>
    <div class="timer-track" id="timer-track"><div id="timer-fill" style="width:30%"></div></div>
    <h2 id="question-text">В каком предложении правильно поставлено <span class="question-accent">ударение?</span></h2>
    <div id="description" class="description-text" hidden></div>
    <div class="question-options" id="options" role="group" aria-label="Пример вариантов">
      <button class="question-choice" type="button" aria-pressed="false"><span class="marker" aria-hidden="true">A</span><span>Он звонил по каталóгу.</span></button>
      <button class="question-choice selected" type="button" aria-pressed="true"><span class="marker" aria-hidden="true">B</span><span>Он звонИт по каталогу́.</span></button>
      <button class="question-choice" type="button" aria-pressed="false"><span class="marker" aria-hidden="true">C</span><span>Он звóнит по каталогу.</span></button>
      <button class="question-choice" type="button" aria-pressed="false"><span class="marker" aria-hidden="true">D</span><span>Он звонит по катáлогу.</span></button>
    </div>
    <div class="explanation" id="explanation" hidden></div>
    <button class="primary-btn" id="answer-btn" type="button">Ответить <span aria-hidden="true">→</span></button>
    <div id="question-status" class="loader" role="status" aria-live="polite"></div>
  </section>
 </main>
 <footer class="site-footer"><span>вы́Читать © 2026</span><span>Тест по русскому языку</span></footer>
</div>
<script>
"use strict";
const choices=[...document.querySelectorAll(".question-choice")];
choices.forEach(button=>button.addEventListener("click",()=>{
 choices.forEach(b=>{const yes=b===button;b.classList.toggle("selected",yes);b.setAttribute("aria-pressed",String(yes))})
}));
document.getElementById("answer-btn").addEventListener("click",()=>{
 document.getElementById("question-status").textContent="Это предпросмотр оформления. Настоящие ответы сохраняются только в Telegram.";
});
</script>
</body></html>
